services:
  db:
    image: postgres:15-alpine
    container_name: edux_postgres
    restart: always
    environment:
      POSTGRES_USER: edux_user
      POSTGRES_PASSWORD: edux_password
      POSTGRES_DB: edux_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edux_user -d edux_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edux_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: